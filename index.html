<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header{
                background-color:#a30681 ;
                color: #f8c3ea;        
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                border: 5px solid #f8c3ea;
            }
            main {
                background-color: #faf6fafd;
                color: #a30681;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
                border: 5px solid #f8c3ea;
            }
            img{
                width: 80px;
                height: 80px;
            }
            .artigo-autor {
                font-weight: bold;
            }

        </style>
    </head>
    <body>
        <header>
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimentos sobre beleza e moda</p>
        </header>
        <main>
            <img src="imagem-blog.png" alt="Uma ilustração em estilo clean e minimalista reunindo cinco ícones de beleza e moda organizados em duas fileiras sobre um fundo bege claro. Na fileira superior, há três ícones quadrados de cantos arredondados: o primeiro mostra um pincel aplicando blush rosado em uma bochecha; o segundo destaca um batom em bala na cor vinho escuro com base dourada; o terceiro exibe óculos de sol estilo gatinho com armação de estampa de tartaruga. Na fileira inferior, há dois elementos: à esquerda, um ícone quadrado rosa claro mostra uma mão com unhas pintadas de lilás segurando um frasco de perfume delicado com um laço; à direita, um lenço estampado rosa claro está elegantemente amarrado em um cabide de roupas.">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Duda Bonfá</p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de maquiagem e falar um pouco sobre a moda. </p>
        </div>

     </main>
</body>
</html>
